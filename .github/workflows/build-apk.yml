name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK licenses
        working-directory: ${{ github.workspace }}
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Get dependencies
        run: flutter pub get

      - name: Fetch FFmpegKit Android AAR (upstream 7.0 asset is missing; use 6.0 LTS full-gpl)
        run: |
          LIBS=$(find ~/.pub-cache/hosted/pub.dev -type d -path "*ffmpeg_kit_flutter_android-*/android/libs" | head -1)
          echo "Plugin libs dir: $LIBS"
          curl -sL -o "$LIBS/com.arthenica.ffmpegkit-flutter-7.0.aar" https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/6.0.2/ffmpeg-kit-full-gpl-6.0.LTS.aar
          ls -lh "$LIBS"

      - name: Generate launcher icons
        run: flutter pub run flutter_launcher_icons || true

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TNxLive-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
