name: tnxlive_app
description: "TNxLive — phone-only 24/7 loop live streaming to YouTube, Facebook and custom RTMP."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_flutter_new_gpl: ^1.6.5
  flutter_foreground_task: ^9.2.0
  file_picker: ^8.3.0
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  path_provider: ^2.1.5
  battery_plus: ^7.0.0
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
